<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Jitsi</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 3px;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 12px;
        }

        .form-control:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .btn-primary {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }

        .btn-primary:hover {
            background: #0069d9;
        }

        .btn-danger {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .meet {
            width: 100%;
            flex: 1;
            min-height: 300px;
            margin-top: 10px;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #dc3545;
            font-size: 11px;
            margin-top: 4px;
        }
    </style>
</head>

<body id="body">
    <div id="setup-panel">
        <div class="header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007bff" stroke-width="2">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            Jitsi Meeting
        </div>
        <div class="form-group">
            <label for="inp_domain">Jitsi Domain</label>
            <input id="inp_domain" class="form-control" type="text" value="" placeholder="Enter Jitsi domain address">
        </div>
        <div class="form-group">
            <label for="inp_room">Room</label>
            <input id="inp_room" class="form-control" type="text" value="" placeholder="Enter room name">
        </div>
        <div class="form-group">
            <label for="inp_user">Display Name</label>
            <input id="inp_user" class="form-control" type="text" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="inp_jwt">JWT Token (Optional / Keycloak)</label>
            <input id="inp_jwt" class="form-control" type="password" placeholder="Jitsi JWT (if available)">
        </div>
        <button id="btn_start" class="btn-primary">Start Meeting</button>
        <div id="div_err" class="error-msg hidden">Please enter a valid room name.</div>
    </div>

    <div id="active-panel" class="hidden">
        <button id="btn_stop" class="btn-danger">Leave Meeting</button>
    </div>

    <div id="meet" class="meet hidden"></div>

    <script src="scripts/code.js"></script>
</body>

</html>
