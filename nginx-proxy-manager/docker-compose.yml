services:
  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - 80:80   # HTTP (redirects to HTTPS)
      - 81:81   # UI
      - 443:443 # HTTPS
    volumes:
      - ./nginx_proxy_data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network
      
networks:
  proxy-network:
    external: true
