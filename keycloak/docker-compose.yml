services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    environment:
      KC_FEATURES: token-exchange # Enable the token exchange feature.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Admin123!
      KC_PROXY_HEADERS: xforwarded # Allows Keycloak to read and trust the real client IP and HTTPS protocol headers forwarded by the reverse proxy.
      KC_HTTP_ENABLED: true # Allows Keycloak to accept HTTP requests when running behind a reverse proxy.
      KC_HOSTNAME: <mykeycloak.mydns.com> # Public hostname
    command: start
    ports:
      - 8080:8080
    depends_on:
      - postgres
    networks:
      - proxy-network

  postgres:
    container_name: postgres-db
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_MASTER_USER}
      POSTGRES_PASSWORD: ${PG_MASTER_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - proxy-network

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: AdminPass!
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - proxy-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  proxy-network:
    external: true
